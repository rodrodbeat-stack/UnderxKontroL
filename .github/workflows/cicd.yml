name: SKYNET CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      operation:
        description: "Operacion que deseas ejecutar"
        required: true
        type: choice
        options:
          - ci
          - cicd
          - deploy
        default: cicd

permissions:
  contents: read

jobs:
  build:
    name: BUILD
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar dashboard
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          echo "BUILD correcto"

  test:
    name: TEST
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura
        run: |
          test -d src
          echo "TEST correcto"

      - name: Verificar workflows
        run: |
          test -d .github/workflows
          test -f .github/workflows/cicd.yml
          echo "Workflows encontrados"

  security:
    name: SECURITY
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Revisar posibles tokens expuestos
        run: |
          if grep -RInE \
            'gh[pousr]_[A-Za-z0-9_]{20,}' \
            --include='*.js' \
            --include='*.html' \
            --exclude-dir=.git \
            .; then
            echo "ERROR: posible token expuesto"
            exit 1
          else
            echo "Revision basica completada"
          fi

  integration:
    name: INTEGRACION
    runs-on: ubuntu-latest

    needs:
      - test
      - security

    steps:
      - name: Confirmar integracion
        run: echo "Integracion correcta"

  deploy-pages:
    name: DEPLOY
    runs-on: ubuntu-latest

    needs:
      - integration

    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.operation == 'deploy')

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
