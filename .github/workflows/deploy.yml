name: SKYNET - Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  BUILD:
    name: Preparar despliegue
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar sitio web
        run: |
          test -f index.html
          echo "Sitio web validado"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  DEPLOY:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    needs: BUILD
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio web
        id: deployment
        uses: actions/deploy-pages@v4
