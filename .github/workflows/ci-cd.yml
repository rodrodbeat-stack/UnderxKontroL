name: SKYNET - CI CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  BUILD:
    name: Build - Validar estructura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos del proyecto
        run: |
          echo "SKYNET - Verificando proyecto"
          test -d .github/workflows
          test -f index.html
          echo "BUILD completado correctamente"
  TEST:
    name: Test - Validar workflows
    runs-on: ubuntu-latest
    needs: BUILD

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar workflows
        run: |
          test -d .github/workflows
          test -f .github/workflows/ci-cd.yml
          echo "TEST completado correctamente"


  SECURITY:
    name: Security - Analisis basico
    runs-on: ubuntu-latest
    needs: TEST

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar archivos sospechosos
        run: |
          if grep -R -n -E \
            'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' \
            --include='*.html' \
            --include='*.js' \
            --include='*.yml' \
            --include='*.yaml' \
            .; then
            echo "ERROR: Posible clave privada encontrada"
            exit 1
          fi

          echo "SECURITY completado correctamente"

  PIPELINE_SUCCESS:
    name: Pipeline - Resultado final
    runs-on: ubuntu-latest
    needs: [BUILD, TEST, SECURITY]

    steps:
      - name: Confirmar resultado
        run: echo "SKYNET CI/CD - Todas las etapas completadas"
