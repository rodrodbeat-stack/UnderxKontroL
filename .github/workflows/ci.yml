name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ejecutar prueba
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Verificar directorio de workflows
        run: |
          if [ -d ".github/workflows" ]; then
            echo "Directorio de workflows encontrado."
          else
            echo "ERROR: No existe .github/workflows"
            exit 1
          fi
